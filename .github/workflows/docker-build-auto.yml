name: Auto Docker Build and Release

on:
  push:
    branches: [main, master]
    paths:
      - VERSION
      - "*.py"
      - requirements.txt
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.sh
      - LICENSE
      - config/config.template.json

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/baidu-autosave

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version change
        id: version
        shell: bash
        run: |
          current_version=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION must contain a semantic version without a leading v" >&2
            exit 1
          fi
          if git show HEAD~1:VERSION >/dev/null 2>&1; then
            previous_version=$(git show HEAD~1:VERSION | tr -d '[:space:]')
          else
            previous_version="0.0.0"
          fi
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          if [ "$current_version" = "$previous_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.version.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.version.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.version.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: steps.version.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
